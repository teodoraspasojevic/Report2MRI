[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "report2mri"
version = "1.0.0"
description = "3D brain MRI generation from radiology reports with adapters on a frozen NV-Generate-MR-Brain diffusion model"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "monai>=1.5.2,<1.7",
    "transformers>=5.14,<6",
    "einops>=0.8",
    "safetensors>=0.4",
    "huggingface_hub>=1.0",
    "nibabel>=5.2",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
report2mri-generate = "report2mri.cli.generate:main"
report2mri-train = "report2mri.cli.train:main"

[tool.setuptools.packages.find]
include = ["report2mri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
